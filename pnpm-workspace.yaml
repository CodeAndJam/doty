# Hold new dependency releases for 10 days before adopting them.
minimumReleaseAge: 14400

minimumReleaseAgeExclude:
  # 14.28.1 ships a security fix; 14.28.0 is deprecated by the maintainers because of it.
  - discord.js

overrides:
  # @electron/rebuild ships an older node-abi that does not know Electron 45's ABI.
  node-abi: ^4.40.0
  # Transitive versions pinned to their patched releases (see pnpm audit).
  tar: 7.5.22
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  '@xmldom/xmldom': 0.8.15
  protobufjs: 7.6.6
  '@protobufjs/utf8': 1.1.2
  ws: 8.22.1
  tmp: 0.2.7
  esbuild: 0.28.2
  'form-data': 4.0.6
  'js-yaml': 4.3.2
  browserslist: 4.29.5
  baseline-browser-mapping: 2.11.34
  simple-git: 4.0.2
  '@simple-git/argv-parser': 2.0.1
  source-map-js: 1.2.2
  minimatch: 11.0.4

onlyBuiltDependencies:
  - '@discordjs/opus'
  - better-sqlite3
  - electron
  - esbuild
  - ffmpeg-static
  - koffi
  - node-llama-cpp
  - onnxruntime-node
  - protobufjs
  - sharp
  - sodium-native
